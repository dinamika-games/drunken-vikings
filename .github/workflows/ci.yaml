name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

env:
  GODOT_VERSION: 4.6.2

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # NOTE (mristin):
      # We check out without LFS and restore .git/lfs from a cache, since
      # every download of the LFS files counts against the bandwidth quota.
      - name: Checkout
        uses: actions/checkout@v5

      - name: List the LFS files
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Cache the LFS files
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull the LFS files
        run: git lfs pull

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the development tools
        run: |
          python -m venv venv
          touch venv/.gdignore
          venv/bin/pip install -r dev/requirements.txt

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --silent --show-error \
            --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d "${{ runner.temp }}/godot"
          rm godot.zip

      - name: Point to Godot
        run: |
          echo "GODOT=${{ runner.temp }}/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore 'DrunkenVikings.sln'

      # NOTE (mristin):
      # We check the formatting and lint first, as a fast-fail.
      - name: Check the formatting and lint
        run: |
          venv/bin/python dev/continuous_integration/precommit.py \
            --select format lint

      - name: Run the tests
        run: |
          venv/bin/python dev/continuous_integration/precommit.py \
            --skip format lint

      - name: Upload the logs of the failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: .cache/precommit/
          if-no-files-found: ignore
