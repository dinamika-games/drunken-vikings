name: Publish

# Publishing a release exports the game for Linux, Windows and macOS, checks
# the packages and attaches their zips to the release. Running the workflow by
# hand without a tag is a dry run, which only uploads the zips as an artifact.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to upload to (empty: a dry run that only uploads artifacts)"
        required: false

env:
  GODOT_VERSION: 4.6.2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # NOTE (mristin):
      # Do not call the variable VERSION! MSBuild picks up the environment
      # variables as properties (case-insensitively), so VERSION would override
      # the project version, and dotnet restore fails on tags such as v1.0.0,
      # which are not valid NuGet versions.
      - name: Determine the tag
        run: |
          echo "RELEASE_TAG=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_ENV"

      - name: Install Godot and the export templates
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --silent --show-error --remote-name \
            "${base}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl --fail --location --silent --show-error --remote-name \
            "${base}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$templates"
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          mv templates/* "$templates/"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install the development tools
        run: |
          python -m venv venv
          touch venv/.gdignore
          venv/bin/pip install -r dev/requirements.txt

      - name: Import
        run: |
          dotnet restore 'DrunkenVikings.sln'
          "$GODOT" --headless --path . --import

      - name: Export, check and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            venv/bin/python dev/package.py --upload "$RELEASE_TAG"
          else
            venv/bin/python dev/package.py
          fi

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.zip
